# Rejection Sampling — Full Pipeline
# Usage: python -m pipeline.rejection_sampling rft_full.yaml

### model
model_name: xingpeng001/qwenvl-direct-sft
lora_path: null
is_lora: false
device: auto
use_modelscope: false
enable_hf_mirror: true
hf_token: null

### dataset
images_dir: /root/Codes/data/SKU110K_fixed/images
low_ap_json: /root/Codes/LlamaFactory/projects/2d_grounding/results/qwen3vl_2b_direct_full_sft_sku110k_train_img_1000/merged_detailed_results.json
# test_image: null  # leave unset or null for full pipeline mode

### prompt
prompt: "This is a retail shelf image. Detect and locate every individual product on the shelf, treating each separate item as a distinct object. Report bounding box coordinates for all items in JSON format."

### inference
max_new_tokens: 8192
temperature: 0.8
top_p: 0.9

batch_size: 4     # how many crops per VLM batch call (4-8 depending on VRAM)
num_gpus: -1      # -1 = all GPUs, 1 = single GPU

### rejection sampling
n_trajectories: 8
max_depth: 2
overlap_ratio: 0.1
iou_threshold: 0.7
top_k: 3
min_improvement: 0.05
min_absolute_ap: 0.4    # absolute AP floor — discard trajectories below this
min_ap_gain_for_split: 0.03

### output
output_dir: ./results/rft/training_images_run_260309