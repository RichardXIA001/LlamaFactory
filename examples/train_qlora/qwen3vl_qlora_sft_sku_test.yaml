### model
model_name_or_path: Qwen/Qwen3-VL-4B-Instruct
quantization_bit: 8  # choices: [8 (bnb/hqq/eetq), 4 (bnb/hqq), 3 (hqq), 2 (hqq)]
quantization_method: bnb  # choices: [bnb, hqq, eetq]
trust_remote_code: true
image_max_pixels: 15873000
image_min_pixels: 3136

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 64          # was 8 (more capacity to memorize 10 samples)
lora_target: all
# lora_dropout: 0.0    # add this if your training framework supports it
flash_attn: fa2

### dataset
dataset: sku_110k_train_ablation
template: qwen3_vl_nothink
cutoff_len: 16384

# for intentional overfit on 10 samples:
max_samples: null        # was null
use_fast_tokenizer: false
preprocessing_num_workers: 16
dataloader_num_workers: 4
remove_unused_columns: false

### output
output_dir: saves/qwen3-vl-4b/qlora/overfit10-sft-sku_110k_train_ablation_20260203
logging_steps: 10
save_steps: 20        # was 500 (easier to inspect early overfit)
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb        # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: qwen3-vl-4b-qlora-overfit10-sft-sku_110k_train_ablation_20260203

### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 4   # was 8 (more optimizer steps per epoch)
learning_rate: 3.0e-4            # was 1.0e-5 (LoRA learns faster)
num_train_epochs: 300            # was 3.0 (needs tons of passes for 10 samples)
lr_scheduler_type: constant      # was cosine (simpler for memorization)
warmup_ratio: 0.0                # was 0.1 (don’t waste steps)
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: saves/qwen3-vl-4b/qlora/overfit10-sft-sku_110k_train_ablation_20260203/checkpoint-100

### eval
# For pure overfit, you can skip eval entirely.
# If you want to sanity-check, uncomment and set val_size: 0.0 or use a fixed tiny eval.
# val_size: 0.0
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 100
