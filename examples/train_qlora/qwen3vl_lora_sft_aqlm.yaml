model_name_or_path: Qwen/Qwen3-4B-Instruct
quantization_bit: 8  # choices: [8 (bnb/hqq/eetq), 4 (bnb/hqq), 3 (hqq), 2 (hqq)]
quantization_method: bnb  # choices: [bnb, hqq, eetq]
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_target: all
flash_attn: fa2

### dataset
dataset: sku_110k_train
template: qwen3_vl_nothink
cutoff_len: 8192

max_samples: null
use_fast_tokenizer: false
preprocessing_num_workers: 16
dataloader_num_workers: 4
remove_unused_columns: false

### output
output_dir: saves/qwen3-vl-4b/qlora/sft-sku_110k_20260131
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
report_to: wandb  # choices: [none, wandb, tensorboard, swanlab, mlflow]
run_name: qwen3-vl-4b-qlora-sft-sku_110k-20260129
### train
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
ddp_timeout: 180000000
resume_from_checkpoint: null

